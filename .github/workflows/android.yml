# Сборка Android-приложения «108»: неподписанный AAB для Google Play (подписывается ключом загрузки вне GitHub)
# и тестовый APK (отладочная подпись) — выкладываются в релиз «android-latest».
# Журнал сборки всегда выкладывается в релиз «android-log» (и при ошибке).
name: Android
on:
  push:
    branches: [main]
    paths: ['108.html', 'page.html', 'art/**', 'sprites/**', 'sfx/**', 'fonts/**', 'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Сборка (журнал → build.log)
        run: |
          set -o pipefail
          {
            echo "== окружение"; node -v; npm -v; java -version 2>&1; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
            echo "== npm ci"; npm ci --no-audit --no-fund
            echo "== www + cap sync"; node scripts/build-www.js && npx cap sync android
            echo "== gradle"; cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug
          } 2>&1 | tee build.log
      - name: Релиз android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oP 'versionCode \K\d+' android/app/build.gradle)
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/bundle/release/app-release.aab 108-unsigned.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk 108-test.apk
          sha256sum 108-unsigned.aab 108-test.apk > SHA256SUMS.txt
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest 108-unsigned.aab 108-test.apk SHA256SUMS.txt --prerelease \
            --title "Android $VN ($VC) — последняя сборка" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. 108-test.apk — для установки на телефон напрямую (отладочная подпись). 108-unsigned.aab — для Google Play, подписывается ключом загрузки отдельно."
      - name: Журнал сборки
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "журнала нет: упал шаг до сборки" > build.log
          tail -c 900000 build.log > build-tail.log
          gh release delete android-log --yes --cleanup-tag || true
          gh release create android-log build-tail.log --prerelease --title "Android: журнал последней сборки" --notes "Коммит ${GITHUB_SHA::7}, результат: ${{ job.status }}"
