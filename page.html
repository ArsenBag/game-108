/* Макет: один экран. Сверху соперники с нарисованными аватарами, в центре овальный стол
   с колодой и битой, снизу — вы и ваша рука. Мультяшный стиль: толстые чернильные контуры,
   жёсткие смещённые тени без размытия, пухлые кнопки, карты летают между местами.
   Единственная тема (намеренно): ночной тёмно-бирюзовый фон и тёплые карты. */
:root {
  --bg: #1f3d4a;            /* ночной фон вокруг стола */
  --bg-dot: #2a5060;        /* горошек на фоне */
  --felt: #2fa38a;          /* сукно стола */
  --felt-dark: #238a74;
  --rim: #d98c3f;           /* деревянный борт */
  --rim-dark: #a86324;
  --ink: #1d1a2e;           /* контуры и тени */
  --card: #fff8e8;          /* карта */
  --card-shade: #efe2c3;
  --back: #d9534f;          /* рубашка */
  --back-2: #f07b6a;
  --black-suit: #1d1a2e;
  --red-suit: #e03c3c;
  --fg: #fff6e4;            /* текст */
  --muted: #b7d6d0;
  --sun: #ffc93c;           /* акцент: можно сыграть, ваш ход */
  --sun-dark: #e0a81a;
  --mint: #8de3a5;          /* очки в минус (хорошо) */
  --berry: #ff6b6b;         /* штраф, очки в плюс */
  --panel: #fff8e8;
  --panel-fg: #1d1a2e;
  --font-display: "Rubik", "Arial Black", Impact, sans-serif;
  --font-body: "Nunito", "Segoe UI", Roboto, system-ui, sans-serif;
  --outline: 3px solid var(--ink);
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; font-weight: 600; line-height: 1.35; overflow: hidden;
  background-image: radial-gradient(var(--bg-dot) 2px, transparent 2.5px);
  background-size: 26px 26px;
}
/* фон-сцена (чайхана ночью) поверх горошка; затемнение к центру, чтобы стол и карты читались */
body.scene {
  background-image: linear-gradient(rgba(16,40,50,.35), rgba(16,40,50,.55) 35%, rgba(16,40,50,.35)), var(--scene, url("art/bg.webp"));
  background-size: cover, cover; background-position: center, center bottom; background-attachment: fixed, fixed;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible, .deck:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1080px; margin-inline: auto;
}

/* ---- шапка ---- */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo {
  font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--sun);
  -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); letter-spacing: -.02em; transform: rotate(-4deg);
}
.round-chip { font-weight: 800; color: var(--muted); }
.top .spacer { flex: 1; }
.btn {
  border: var(--outline); background: var(--card); color: var(--ink); padding: 8px 16px; border-radius: 14px;
  font-weight: 800; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--sun); }
.btn.quiet { background: var(--felt); color: var(--fg); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 11px; box-shadow: 0 3px 0 var(--ink); }

/* ---- соперники ---- */
.seats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

@keyframes seat-pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.bubble {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%) scale(0); transform-origin: bottom center;

}
.bubble.show { animation: bubble 2.6s var(--bounce) forwards; }
@keyframes bubble { 0% { transform: translateX(-50%) scale(0); } 12% { transform: translateX(-50%) scale(1); } 85% { transform: translateX(-50%) scale(1); opacity: 1; } 100% { transform: translateX(-50%) scale(.6); opacity: 0; } }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: var(--card); border-right: var(--outline); border-bottom: var(--outline); transform: translateX(-50%) rotate(45deg); }

/* ---- стол ---- */
.arena { flex: 1; min-height: 170px; display: grid; place-items: center; }
.table {
  position: relative; width: min(100%, 720px); height: 100%; max-height: 300px; min-height: 160px;
  border-radius: 999px; background: var(--felt); border: 10px solid var(--rim);
  box-shadow: inset 0 0 0 4px var(--ink), 0 0 0 4px var(--ink), 0 10px 0 4px var(--rim-dark), 0 14px 0 4px var(--ink);
  background-image: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.14), transparent 55%);
  display: flex; align-items: center; justify-content: center; gap: clamp(16px, 5vw, 56px); box-sizing: border-box;
}
.scene .table { background-image: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.16), rgba(0,0,0,.18) 80%), url("art/felt.webp"); background-size: auto, 256px 256px; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pile .lbl { font-size: 12px; font-weight: 800; color: var(--fg); opacity: .8; font-variant-numeric: tabular-nums; }
.deck { position: relative; width: 72px; height: 102px; border-radius: 10px; }
.deck .back { position: absolute; inset: 0; }
.deck .back:nth-child(2) { transform: translate(3px, -3px); }
.deck .back:nth-child(3) { transform: translate(6px, -6px); }
.deck.clickable { cursor: pointer; }
.deck.clickable .back:last-child { box-shadow: 0 0 0 4px var(--sun), 4px 4px 0 4px var(--ink); animation: wiggle 1.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: translate(6px, -6px) rotate(0); } 50% { transform: translate(6px, -9px) rotate(-3deg); } }
.discard-slot { width: 72px; height: 102px; }
.status { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 130px; max-width: 220px; text-align: center; }
.chip {
  padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--ink);
  background: var(--card); border: var(--outline); box-shadow: 2px 3px 0 var(--ink); animation: chip-in .35s var(--bounce);
}
.chip.danger { background: var(--berry); }
.chip.gold { background: var(--sun); }
.chip .suit-big { font-size: 18px; line-height: 1; }
@keyframes chip-in { from { transform: scale(.5); } }
.turn-note { font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--fg); text-shadow: 2px 2px 0 var(--ink); text-wrap: balance; }
.turn-note.you { color: var(--sun); animation: shout .5s var(--bounce); }
@keyframes shout { from { transform: scale(.4) rotate(-8deg); } }
.turn-note.wait { font-size: 15px; opacity: .85; }

/* ---- карты ---- */
.card, .back {
  box-sizing: border-box; width: 72px; height: 102px; border-radius: 10px; position: relative; border: var(--outline);
  box-shadow: 4px 4px 0 var(--ink);
}
.card {
  background: var(--card); color: var(--black-suit); font-family: var(--font-display); font-weight: 900; padding: 0; text-align: left;
  display: block; user-select: none;
  background-image: linear-gradient(160deg, transparent 60%, var(--card-shade));
}
.card.red { color: var(--red-suit); }
.card .corner { position: absolute; left: 5px; top: 3px; font-size: 17px; line-height: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.card .corner.b { left: auto; right: 5px; top: auto; bottom: 3px; transform: rotate(180deg); }
.card .corner .s { font-family: var(--font-body); font-size: 13px; line-height: 1; display: block; }
.card .center { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-body); font-size: 40px; }
.card.q .center { font-size: 32px; }
/* значки мастей и придворный арт: картинка, под ней запасной символ (виден, если арт не загрузился) */
.ci, .art { display: inline-grid; place-items: center; position: relative; }
.ci { width: 1em; height: 1em; }
.card .corner .ci { width: 13px; height: 13px; }

.card .center .art { width: 64px; height: 68px; }
.card.q .center .art { width: 64px; height: 68px; }
.ci b, .art b { font-weight: 900; }
.art b { font-size: 32px; }
.art-ok .ci, .art-ok .art { background: no-repeat center / contain; }

.art-ok .ci-D { background-image: url("art/suit_D.webp"); } .art-ok .ci-H { background-image: url("art/suit_H.webp"); }

.art-ok .art-QS { background-image: url("art/card_QS.webp"); }
.art-ok .art-KS { background-image: url("art/card_KS.webp"); }
.art-ok .art-AS { background-image: url("art/card_AS.webp"); }
.art-ok .art-JC { background-image: url("art/card_JC.webp"); }
.art-ok .art-QC { background-image: url("art/card_QC.webp"); }
.art-ok .art-KC { background-image: url("art/card_KC.webp"); }
.art-ok .art-AC { background-image: url("art/card_AC.webp"); }
.art-ok .art-JD { background-image: url("art/card_JD.webp"); }
.art-ok .art-QD { background-image: url("art/card_QD.webp"); }
.art-ok .art-KD { background-image: url("art/card_KD.webp"); }
.art-ok .art-AD { background-image: url("art/card_AD.webp"); }
.art-ok .art-JH { background-image: url("art/card_JH.webp"); }
.art-ok .art-QH { background-image: url("art/card_QH.webp"); }
.art-ok .art-KH { background-image: url("art/card_KH.webp"); }
.art-ok .art-AH { background-image: url("art/card_AH.webp"); }
.art-ok .card.court { background-image: linear-gradient(160deg, transparent 60%, var(--card-shade)), radial-gradient(circle at 50% 55%, rgba(255,201,60,.35), transparent 60%); }
.art-ok .card.q { box-shadow: 4px 4px 0 var(--ink), inset 0 0 0 2px var(--sun); }
.back {
  background: var(--back);

  box-shadow: inset 0 0 0 4px var(--card), 4px 4px 0 var(--ink);
}

.mini.back { box-shadow: inset 0 0 0 2px var(--card), 2px 2px 0 var(--ink); }
.art-ok .mini.back { box-shadow: inset 0 0 0 1.5px var(--card), 2px 2px 0 var(--ink); }

/* ---- персонажи ---- */
.ava-wrap { position: relative; width: 88px; height: 98px; }
.ava { width: 100%; height: 100%; display: block; overflow: visible; }
.ava-wrap.mood-in { animation: mood-in .5s var(--bounce); transform-origin: 50% 100%; }
@keyframes mood-in { 0% { transform: scale(1.2, .8); } 40% { transform: scale(.9, 1.14); } 70% { transform: scale(1.04, .97); } 100% { transform: scale(1); } }
.confetti { position: absolute; inset: 0; pointer-events: none; }

  transform: translate(-50%, -50%) rotate(var(--a)) translateY(-10px); animation: burst 1.2s cubic-bezier(.2, .8, .3, 1) var(--dl) infinite; }
@keyframes burst { 0% { transform: translate(-50%, -50%) rotate(var(--a)) translateY(-10px) rotate(0); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(-1 * var(--r))) rotate(var(--rot)); opacity: 0; } }
.me-ava { position: relative; }

/* ---- оживление: попапы, тряска, бейджи ---- */
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 22px; color: var(--fg);
  -webkit-text-stroke: 1px var(--ink); text-shadow: 3px 3px 0 var(--ink); animation: pop-up 1.3s cubic-bezier(.2, .8, .3, 1) forwards; pointer-events: none; }
.pop.bad { color: var(--berry); } .pop.good { color: var(--mint); } .pop.gold { color: var(--sun); font-size: 26px; }
@keyframes pop-up { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); } 30% { transform: translate(-50%, -55%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
.app.shake { animation: shake .4s linear; } .app.shake-big { animation: shake .6s linear; }

.badge-d { position: absolute; right: -2px; top: 4px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 800; box-shadow: 2px 2px 0 var(--ink); transform: rotate(8deg); }

b.bump { display: inline-block; animation: bump .6s var(--bounce); color: var(--sun); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
/* мягкое мерцание фонарей на фоне */
.scene::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 15% 6%, rgba(255,190,80,.14), transparent 22%), radial-gradient(ellipse at 85% 6%, rgba(255,190,80,.14), transparent 22%);
  animation: lantern 3.6s ease-in-out infinite alternate; }
@keyframes lantern { from { opacity: .55; } to { opacity: 1; } }
.app { position: relative; z-index: 1; }

/* ---- живой стол: вспышки спецкарт, баннер партии, шкала опасности, реакции, куча биты ---- */
.burst { position: fixed; z-index: 16; transform: translate(-50%, -50%); pointer-events: none; display: grid; place-items: center; text-align: center;
  animation: burst-in 1.25s cubic-bezier(.2, 1.4, .4, 1) forwards; }
.burst::before { content: ""; position: absolute; inset: -34px -46px; background: var(--c, var(--sun)); border: 4px solid var(--ink); z-index: -1;
  clip-path: polygon(50% 0%, 61% 18%, 82% 6%, 78% 29%, 100% 32%, 84% 50%, 100% 68%, 78% 71%, 82% 94%, 61% 82%, 50% 100%, 39% 82%, 18% 94%, 22% 71%, 0% 68%, 16% 50%, 0% 32%, 22% 29%, 18% 6%, 39% 18%);
  filter: drop-shadow(5px 5px 0 var(--ink)); animation: burst-spin 1.25s linear; }
.burst b { font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 5vw, 44px); line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
.burst small { display: block; font-family: var(--font-display); font-weight: 900; font-size: 16px; color: var(--ink); margin-top: 4px; }
.burst.skip { --c: #4f7bd9; } .burst.take { --c: var(--berry); } .burst.chain { --c: #ff8c2b; } .burst.queen { --c: var(--sun); }
.burst.eight { --c: #9b59b6; } .burst.ok { --c: var(--mint); } .burst.out { --c: var(--sun); } .burst.reset { --c: #2fa38a; } .burst.elim { --c: #e03c3c; }
@keyframes burst-in { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-25deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(6deg); }
  32% { transform: translate(-50%, -50%) scale(.95) rotate(-3deg); } 45% { transform: translate(-50%, -50%) scale(1.04) rotate(0deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(.9); } }
@keyframes burst-spin { to { rotate: 12deg; } }
.round-banner { position: fixed; z-index: 16; transform: translate(-50%, -50%); pointer-events: none; text-align: center; animation: banner 1.9s cubic-bezier(.2, 1.2, .4, 1) forwards; }
.round-banner b { display: block; font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 7vw, 60px); color: var(--sun); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); line-height: 1; }
.round-banner small { display: inline-block; margin-top: 6px; font-weight: 800; font-size: 15px; color: var(--ink); background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; box-shadow: 3px 3px 0 var(--ink); }
@keyframes banner { 0% { opacity: 0; transform: translate(-150%, -50%) skewX(-12deg); } 20% { opacity: 1; transform: translate(-50%, -50%) skewX(0); } 75% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(60%, -50%) skewX(10deg); } }
.meter { width: 84px; height: 7px; border-radius: 99px; background: rgba(0,0,0,.35); border: 2px solid var(--ink); overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #8de3a5, #ffc93c 60%, #ff6b6b); background-size: 84px 100%; border-right: 2px solid var(--ink); transition: width .6s var(--bounce); }
.meter.hot { animation: hot .6s ease-in-out infinite alternate; } @keyframes hot { to { box-shadow: 0 0 10px 2px #ff6b6b; } }
.me-row .meter { width: 130px; } .me-row .meter i { background-size: 130px 100%; }
.seat.out .ava-wrap, .me-row.out .ava-wrap { filter: grayscale(.85) brightness(.85); }
.seat.out .name { text-decoration: line-through; opacity: .7; }
.badge-last.gone { background: #888; animation: none; transform: translateX(-50%) rotate(-8deg); }
.discard-slot { position: relative; }
.discard-slot .card { position: absolute; left: 0; top: 0; transform: rotate(var(--r, 0deg)); }
.discard-slot .card.under { filter: brightness(.92); box-shadow: 2px 2px 0 var(--ink); }
.table { transition: box-shadow .4s; }
.table.danger { animation: table-danger 1.1s ease-in-out infinite alternate; }
.table.gold { box-shadow: inset 0 0 0 4px var(--ink), 0 0 0 4px var(--ink), 0 10px 0 4px var(--rim-dark), 0 14px 0 4px var(--ink), 0 0 40px 6px rgba(255,201,60,.55); }
@keyframes table-danger { from { box-shadow: inset 0 0 0 4px var(--ink), 0 0 0 4px var(--ink), 0 10px 0 4px var(--rim-dark), 0 14px 0 4px var(--ink), 0 0 10px 2px rgba(255,107,107,.3); }
  to { box-shadow: inset 0 0 0 4px var(--ink), 0 0 0 4px var(--ink), 0 10px 0 4px var(--rim-dark), 0 14px 0 4px var(--ink), 0 0 46px 10px rgba(255,107,107,.75); } }
.emos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.emo { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); background: var(--card); padding: 0; overflow: hidden; box-shadow: 0 3px 0 var(--ink); transition: transform .12s var(--bounce); }
.emo:hover { transform: translateY(-3px) scale(1.08); } .emo:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.emo i { display: block; width: 100%; height: 100%; background-repeat: no-repeat; font-style: normal; font-size: 20px; line-height: 34px; }
.emo.cool { opacity: .45; pointer-events: none; }
.rain { position: fixed; top: -20px; width: 10px; height: 14px; border: 2px solid var(--ink); border-radius: 2px; background: var(--c); z-index: 25; pointer-events: none; animation: rain var(--d) linear var(--dl) forwards; }
@keyframes rain { to { transform: translate(var(--x), 110vh) rotate(var(--rot)); } }
.pick-info { min-height: 38px; font-size: 13px; color: #4b4858; margin-top: 4px; }
.pick-info b { color: var(--ink); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .me-row { flex-wrap: wrap; row-gap: 4px; }
  .me-row .emos { flex-basis: 100%; flex-wrap: nowrap; }
  .emo { width: 34px; height: 34px; } .emo i { line-height: 28px; font-size: 17px; }
}
.scenes { display: flex; gap: 6px; flex-wrap: wrap; }
.scene-btn { width: 74px; height: 46px; border-radius: 10px; border: 3px solid var(--ink); background: center / cover no-repeat; padding: 0; position: relative; box-shadow: 0 3px 0 var(--ink); }
.scene-btn span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 800; color: #fff; background: rgba(29,26,46,.75); padding: 1px 0; }
.scene-btn.on { outline: 4px solid var(--sun); outline-offset: 1px; }
.scene-btn.rnd { background: repeating-linear-gradient(45deg, #ffc93c 0 8px, #ff6b6b 8px 16px); }
.field .hint2 { font-size: 12px; color: #6b6878; margin-top: 2px; }
.lore h3 { font-family: var(--font-display); font-size: 16px; margin: 16px 0 6px; }
.lore p { margin: 0 0 8px; }
.lore .legend { background: #fff3cf; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 3px 3px 0 var(--ink); }
.lore .tree { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.lore .tree span { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 9px; box-shadow: 2px 2px 0 var(--ink); }
.lore .tree span.me { background: var(--sun); }
.lore .src { font-size: 12px; color: #6b6878; }
.tip { margin-top: 12px; font-size: 13px; background: #fff3cf; border: 2px dashed var(--ink); border-radius: 12px; padding: 7px 10px; }
.winner { display: flex; align-items: center; gap: 14px; margin: 6px 0 12px; }
.winner .ava-wrap { width: 110px; height: 124px; }
.elim-list { margin: 0 0 10px; padding-left: 20px; font-size: 14px; }

/* ---- колоды: рубашка и оттенок лица карты ---- */
.art-ok .back { background-image: var(--back-img, url("art/back.webp")); }
body[data-deck="city"] .card { --card: #f3f7ff; --card-shade: rgba(70, 90, 210, .16); }
body[data-deck="silk"] .card { --card: #fff4de; --card-shade: rgba(170, 100, 20, .18); }
body[data-deck="samarkand"] .card { --card: #f2fbff; --card-shade: rgba(20, 130, 180, .17); }
body[data-deck="cosmos"] .card { --card: #f6f2ff; --card-shade: rgba(120, 70, 210, .17); }
/* ---- редкие версии карт ---- */
.card.rar-silver { background-image: linear-gradient(135deg, #fbfcff 0%, #d8dee9 32%, #ffffff 50%, #c9d1df 68%, #f3f5fa 100%); }
.card.rar-gold { background-image: linear-gradient(135deg, #fff7d9 0%, #ffd767 30%, #fff4c7 50%, #f0bd45 70%, #fff0b8 100%); }
.card.rar-holo { background-image: linear-gradient(135deg, #ffe3f7, #e3f6ff 35%, #fffbd6 65%, #e6ffe9); overflow: hidden; }
.card.rar-silver::before, .card.rar-gold::before, .card.rar-holo::before {
  content: "✦"; position: absolute; right: 5px; top: 3px; font-size: 13px; line-height: 1; z-index: 2; font-family: var(--font-body); }
.card.rar-silver::before { color: #8b97ad; } .card.rar-gold::before { color: #c98a00; }
.card.rar-holo::before { color: #d63fb8; animation: holo-hue 3s linear infinite; }
.card.rar-silver { box-shadow: inset 0 0 0 2px #aeb9cc, 4px 4px 0 var(--ink); }
.card.rar-gold { box-shadow: inset 0 0 0 3px #e2a72b, 0 0 10px 1px rgba(255, 201, 60, .55), 4px 4px 0 var(--ink); }
.card.rar-holo { box-shadow: inset 0 0 0 3px #c66ff0, 0 0 12px 2px rgba(150, 120, 255, .5), 4px 4px 0 var(--ink); }
.card.rar-holo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: linear-gradient(115deg, transparent 18%, rgba(255, 60, 200, .32) 32%, rgba(60, 220, 255, .34) 46%, rgba(255, 240, 60, .32) 60%, rgba(120, 255, 140, .28) 72%, transparent 86%);
  background-size: 260% 260%; mix-blend-mode: multiply; animation: holo-move 3.2s linear infinite; }
@keyframes holo-move { from { background-position: 100% 0; } to { background-position: -160% 0; } }
@keyframes holo-hue { to { filter: hue-rotate(360deg); } }
.card.rar-legend { background: #241d3a; box-shadow: 0 0 0 3px #ffd34d, 0 0 16px 4px rgba(255, 211, 77, .65), 4px 4px 0 3px var(--ink); animation: legend-glow 1.4s ease-in-out infinite alternate; overflow: hidden; }
.card.rar-legend .center { display: none; }
.card.rar-legend .legend-art { position: absolute; inset: 0; border-radius: inherit; background: center 40% / cover no-repeat; }
.card.rar-legend .corner { z-index: 2; background: rgba(255, 252, 240, .94); border-radius: 7px; padding: 3px 3px 2px; box-shadow: 1px 1px 0 var(--ink); }
.card.rar-legend::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .45) 45%, transparent 60%); background-size: 300% 100%; animation: holo-move 2.6s linear infinite; }
@keyframes legend-glow { to { box-shadow: 0 0 0 3px #fff2b0, 0 0 26px 8px rgba(255, 211, 77, .85), 4px 4px 0 3px var(--ink); } }
.hand .card.legal.rar-legend, .hand .card.legal.rar-holo, .hand .card.legal.rar-gold { box-shadow: 0 0 0 4px var(--sun), 0 0 18px 4px rgba(255, 211, 77, .7), 4px 4px 0 4px var(--ink); }
.burst.rare-legend { --c: linear-gradient(135deg, #ffd34d, #ff6b6b, #c66ff0); }
.burst.rare-legend::before, .burst.rare-holo::before { background: linear-gradient(135deg, #ffd34d, #ff6bd5, #5ad7ff); }
/* ---- всплывашки ---- */
#toasts { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 60; pointer-events: none; display: grid; gap: 8px; }
.toast { display: flex; align-items: center; gap: 12px; min-width: 260px; max-width: min(420px, 92vw); padding: 10px 14px; border-radius: 16px; background: var(--card);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); color: var(--ink); animation: toast-in .45s cubic-bezier(.2, 1.4, .4, 1); }
.toast.out { animation: toast-out .35s ease-in forwards; }
.toast .ti { font-size: 30px; line-height: 1; flex: none; display: grid; place-items: center; min-width: 40px; }
.toast b { display: block; font-family: var(--font-display); font-size: 15px; }
.toast small { display: block; font-size: 13px; color: #4b4858; }
.toast.ach { background: #fff3cf; } .toast.rank { background: linear-gradient(135deg, #fff3cf, #ffd34d); } .toast.rare { background: #f3ecff; }
.toast .tcard { display: block; width: 40px; height: 57px; position: relative; }
.toast .tcard .card { transform: scale(.555); transform-origin: top left; position: absolute; left: 0; top: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-30px) scale(.8); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-20px) scale(.9); } }
/* ---- подсказки аксакала ---- */
#coach { position: fixed; left: 14px; bottom: 14px; z-index: 55; display: flex; align-items: flex-end; gap: 6px; max-width: min(340px, calc(100vw - 28px));
  transform: translateY(140%); opacity: 0; transition: transform .45s cubic-bezier(.2, 1.3, .4, 1), opacity .3s; pointer-events: none; }
#coach.show { transform: none; opacity: 1; pointer-events: auto; }
#coach .c-ava { flex: none; } #coach .c-ava .ava-wrap { width: 78px; height: 88px; }
#coach .c-box { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px 16px 16px 4px; box-shadow: 4px 4px 0 var(--ink); padding: 9px 12px; margin-bottom: 18px; }
#coach .c-box b { font-family: var(--font-display); font-size: 13px; color: #8a5a00; }
#coach .c-box p { margin: 3px 0 8px; font-size: 14px; line-height: 1.35; }
#coach .c-row { display: flex; align-items: center; gap: 12px; }
#coach .c-row a { font-size: 12px; color: #6b6878; }
@media (max-width: 560px) { #coach { top: 70px; bottom: auto; max-width: calc(100vw - 28px); transform: translateY(-160%); } #coach.show { transform: none; } #coach .c-ava .ava-wrap { width: 58px; height: 66px; } #coach .c-box { margin-bottom: 0; } }
.hand .card.nope { animation: nope .35s; }
@keyframes nope { 20%, 60% { transform: translateX(-6px) rotate(-3deg); } 40%, 80% { transform: translateX(6px) rotate(3deg); } }
/* ---- байка в окне партии ---- */
.tip.story { display: flex; gap: 10px; align-items: center; border-style: solid; background: #f3ecff; }
.tip.story .ava-wrap { width: 58px; height: 66px; flex: none; }
/* ---- старт: быстрые кнопки, колоды ---- */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
.qbtn { display: grid; justify-items: center; gap: 2px; padding: 8px 6px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); font: inherit; cursor: pointer; text-align: center; }
.qbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.qbtn .qi { font-size: 22px; line-height: 1; } .qbtn b { font-family: var(--font-display); font-size: 13px; line-height: 1.15; } .qbtn small { font-size: 11px; color: #6b6878; line-height: 1.2; }
.qbtn.daily { background: linear-gradient(135deg, #fff3cf, #ffd34d); }
.qbtn.daily.done { background: #e9f8ee; }
.first-note { font-size: 13px; background: #e9f8ee; border: 2px dashed var(--ink); border-radius: 12px; padding: 7px 10px; margin: 0 0 10px; }
.decks { display: flex; gap: 6px; flex-wrap: wrap; }
.deck-btn { width: 52px; height: 70px; border-radius: 9px; border: 3px solid var(--ink); background: center / cover no-repeat; padding: 0; position: relative; box-shadow: 0 3px 0 var(--ink); }
.deck-btn span { position: absolute; left: -3px; right: -3px; bottom: -3px; font-size: 9px; font-weight: 800; color: #fff; background: rgba(29, 26, 46, .82); border-radius: 0 0 8px 8px; padding: 1px 0; line-height: 1.2; }
.deck-btn.on { outline: 4px solid var(--sun); outline-offset: 1px; }
.deck-btn.rnd { background: repeating-linear-gradient(45deg, #9b59b6 0 8px, #4f7bd9 8px 16px); }
/* ---- профиль ---- */
.rankbox { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #fff3cf, #ffe08a); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; box-shadow: 3px 3px 0 var(--ink); }
.rankbox .rk-ico { font-size: 40px; } .rankbox b { font-family: var(--font-display); font-size: 18px; } .rankbox small { font-size: 12px; color: #4b4858; }
.xpbar { height: 10px; border-radius: 99px; background: rgba(0, 0, 0, .12); border: 2px solid var(--ink); overflow: hidden; margin: 5px 0 3px; min-width: 180px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #8de3a5, #ffc93c); }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 12px 0 4px; }
.stat { text-align: center; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 2px; }
.stat b { display: block; font-family: var(--font-display); font-size: 18px; } .stat small { font-size: 11px; color: #6b6878; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.sub-h { font-family: var(--font-display); font-size: 15px; margin: 12px 0 6px; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 320px; overflow: auto; padding: 2px; }
.ach { display: grid; grid-template-columns: 32px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 6px 8px; border-radius: 12px; border: 2px dashed #b9b4c6; background: #f4f2f8; opacity: .62; filter: grayscale(1); }
.ach span { grid-row: 1 / 3; font-size: 22px; text-align: center; } .ach b { font-size: 12px; line-height: 1.2; } .ach small { font-size: 10.5px; color: #6b6878; line-height: 1.2; }
.ach.on { opacity: 1; filter: none; border: 2px solid var(--ink); background: #fff3cf; box-shadow: 2px 2px 0 var(--ink); }
/* ---- альбом ---- */
.note-s { font-size: 13px; color: #4b4858; margin: 0 0 10px; }
.seg.tabs { flex-wrap: wrap; margin-bottom: 10px; } .seg.tabs small { font-size: 11px; opacity: .75; }
.album { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; max-height: 360px; overflow: auto; padding: 4px; }
.album.leg { grid-template-columns: repeat(4, 1fr); }
.acell { position: relative; width: 50px; height: 71px; margin: 0 auto; }
.acell .card { transform: scale(.695); transform-origin: top left; position: absolute; left: 0; top: 0; pointer-events: none; }
.album.leg .acell { width: 86px; height: 122px; } .album.leg .acell .card { transform: scale(1.195); }
.acell.locked .back { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .28; filter: grayscale(1); box-shadow: 2px 2px 0 var(--ink); border-radius: 8px; }
.acell.locked i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 22px; color: #6b6878; }
.acell .acnt { position: absolute; right: -4px; bottom: -4px; font-style: normal; font-size: 10px; font-weight: 900; background: var(--sun); border: 2px solid var(--ink); border-radius: 99px; padding: 0 4px; }
@media (max-width: 560px) { .album { grid-template-columns: repeat(6, 1fr); } .album.leg { grid-template-columns: repeat(2, 1fr); } }
/* ---- лор: вкладки ---- */
.lore .facts { margin: 0; padding-left: 18px; } .lore .facts li { margin-bottom: 6px; }
.baiki { display: grid; gap: 8px; }
.baika { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.baika .ava-wrap { width: 50px; height: 56px; flex: none; }
.baika.locked { border-style: dashed; opacity: .6; } .baika.locked .ava-wrap { filter: grayscale(1) brightness(.6); }
.baika b { font-size: 13px; } .baika p { margin: 2px 0 0; font-size: 13px; }
.seat .ava-wrap { cursor: pointer; }
.share-btn { background: linear-gradient(135deg, #8de3a5, #5ad7ff) !important; }

/* ---- летающие карты ---- */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.fx .card, .fx .back { position: absolute; left: 0; top: 0; margin: 0; }

/* ---- модальные окна ---- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(20, 30, 40, .7); display: grid; place-items: center; z-index: 20; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px;
}
.modal {
  background: var(--panel); color: var(--panel-fg); border: 4px solid var(--ink); border-radius: 22px; padding: 22px 22px 18px;
  width: min(580px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; box-shadow: 8px 8px 0 var(--ink);
  animation: modal-in .4s var(--bounce);
}
@keyframes modal-in { from { transform: scale(.7) rotate(-2deg); opacity: 0; } }
.modal h2 { font-family: var(--font-display); font-weight: 900; font-size: 22px; margin: 0 0 12px; text-wrap: balance; line-height: 1.15; }
.modal h2.big { font-size: 40px; color: var(--sun); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
.modal p { margin: 0 0 12px; max-width: 62ch; }

  let G = null, me = 0, botTimer = null, myName = 'Игрок';

  const ART = ['art/suit_S.webp', 'art/suit_C.webp', 'art/suit_D.webp', 'art/suit_H.webp', 'art/back.webp', 'art/felt.webp', 'art/bg.webp']
    .concat('SCDH'.split('').flatMap(s => 'JQKA'.split('').map(r => `art/card_${r}${s}.webp`)));

  // ---------- настройки (запоминаются) ----------
  const settings = { sound: true, level: 'pro', mode: 'classic', bg: 'random', speed: 'normal', deck: 'random', coach: true, vibro: true };
  const CAN_VIBRATE = typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';

  try { Object.assign(settings, JSON.parse(localStorage.getItem('g108settings') || '{}')); } catch (e) {}
  function saveSettings() { try { localStorage.setItem('g108settings', JSON.stringify(settings)); } catch (e) {} }
  const LEVELS = [['greedy', 'Новичок'], ['eights', 'Обычный'], ['pro', 'Профи']];
  const MODES = [['classic', 'Классика', 'Первый, кто набрал 108, проиграл.'], ['elim', 'На выбывание', 'Набравший 108 выходит из-за стола, играем до последнего.']];
  const SPEEDS = [['normal', 'Спокойный'], ['fast', 'Быстрый']];
  const SPD = () => settings.speed === 'fast' ? .6 : 1;
  // места за столом (фоны SpriteCook)
  const SCENES = [['chaikhana', 'Чайхана', 'art/bg.webp', 'art/bg_t.webp'], ['train', 'Поезд', 'art/bg_train.webp', 'art/bg_train_t.webp'],
    ['yard', 'Махалля', 'art/bg_yard.webp', 'art/bg_yard_t.webp'], ['roof', 'Крыша', 'art/bg_roof.webp', 'art/bg_roof_t.webp'], ['yurt', 'Юрта', 'art/bg_yurt.webp', 'art/bg_yurt_t.webp'],
    ['city', 'U Tower', 'art/bg_city.webp', 'art/bg_city_t.webp']];
  let sceneNow = null;
  function applyScene(force, fixed) {
    let id = fixed || settings.bg;
    if (id === 'random' || !SCENES.some(x => x[0] === id)) {
      if (sceneNow && !force) return;
      const pool = SCENES.filter(x => x[0] !== sceneNow); id = pool[Math.floor(Math.random() * pool.length)][0];
    }
    sceneNow = id;
    const sc = SCENES.find(x => x[0] === id);
    const im = new Image(); im.onload = () => document.body.style.setProperty('--scene', `url("${sc[2]}")`); im.src = sc[2];

  }
  // =====================================================================================

  const DECKS = [['chaikhana', 'Чайхана', 'art/back.webp'], ['city', 'Ташкент Сити', 'art/back_city.webp'], ['silk', 'Шёлковый путь', 'art/back_silk.webp'],

    const id = deckIdFor(G);
    if (id === deckNow) return;
    deckNow = id;
    const d = DECKS.find(x => x[0] === id);
    document.body.dataset.deck = id;

  }
  // редкость считается по «семени оформления» игры, номеру партии и карте — у всех за столом одинаково
  const LEGEND_IDS = new Set(['QS', 'KH', 'AS', 'JD', 'QH', 'KS', 'AH', 'JC']);
  const LEGEND_HERO = { QS: 'f09', KH: 'm14', AS: 'm15', JD: 'm10', QH: 'f07', KS: 'm13', AH: 'm08', JC: 'f10' };
  const RAR_NAME = { silver: 'Серебряная', gold: 'Золотая', holo: 'Голограмма', legend: 'Легенда' };
  const RAR_ORDER = ['legend', 'holo', 'gold', 'silver'];
  function h01(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  function rarityOf(c) {
    if (!G || !c || c.rank === '?' || G.skinSeed == null) return '';
    const k = G.skinSeed + ':' + G.round + ':' + c.id;
    if (LEGEND_IDS.has(c.id) && h01(k + ':L') < 0.025) return 'legend';

  function seededRand(seed) { let s = seed | 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      shocked: { f: ['shocked'], v: .5 }, meh:  { f: ['meh', 'ui_drop_001'], v: .5 }, think: { f: ['think', 'ui_question_001'], v: .35 }, overwhelmed: { f: ['overwhelmed'], v: .45 },

        if (!G.losers.includes(me)) confettiRain(90);
      }
    }
  }

  // ---------- рендер ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isRed = c => c.suit === 'H' || c.suit === 'D';
  const order = c => E.SUITS.indexOf(c.suit) * 10 + E.RANKS.indexOf(c.rank);
  const ACTIVE = new Set(['play', 'chooseSuit', 'counterOffer']);

  // карта: углы — номинал + значок масти (картинка, запасной — символ), центр — придворный арт (В/Д/К/Т) или крупный значок масти
  function cardHTML(c, cls, attrs, rar) {
    const court = 'JQKA'.includes(c.rank);
    if (rar === undefined) rar = rarityOf(c);
    const leg = rar === 'legend' && LEGEND_IDS.has(c.id) ? `<span class="legend-art" style="background-image:url('art/legend_${c.id}.webp')"></span>` : '';
    if (rar) cls = (cls || '') + ' rar-' + rar;
    const sym = `<i class="ci ci-${c.suit}"><b>${E.SUIT_SYM[c.suit]}</b></i>`;
    return `<button type="button" class="card ${isRed(c) ? 'red' : ''} ${c.rank === 'Q' ? 'q' : ''} ${court ? 'court' : 'pip'} r${c.rank} ${cls || ''}" ${attrs || ''} aria-label="${E.cardName(c)}${rar ? ' · ' + RAR_NAME[rar].toLowerCase() : ''}">${leg}
      <span class="corner">${E.RANK_RU[c.rank]}<span class="s">${sym}</span></span>
      <span class="center">${court ? `<i class="art art-${c.rank}${c.suit}"><b>${E.SUIT_SYM[c.suit]}</b></i>` : sym}</span>
      <span class="corner b">${E.RANK_RU[c.rank]}<span class="s">${sym}</span></span>
    </button>`;
  }

  const prevScores = {};
  let wasMyTurn = false;
  const outW = () => 'вне игры';
  const ptsW = n => { const a = Math.abs(n) % 100, b = a % 10; return `${n} ${a > 10 && a < 20 ? 'очков' : b === 1 ? 'очко' : b >= 2 && b <= 4 ? 'очка' : 'очков'}`; };
  function meterHTML(score) {
    const pct = Math.min(100, Math.round(score / 108 * 100));
    return `<div class="meter ${score >= 90 ? 'hot' : ''}" title="${score} из 108"><i style="width:${pct}%"></i></div>`;
  }
  // лёгкий наклон карт в бите — всегда одинаковый для одной карты
  function tilt(c, isTop) { let h = 0; for (const ch of c.id) h = (h * 31 + ch.charCodeAt(0)) | 0; h = Math.abs(h); return isTop ? (h % 7) - 3 : (h % 25) - 12; }
  // кнопки-реакции: лицо вашего героя с нужной эмоцией
  const EMOS = [['laugh', 1, 'Ха-ха!', '😂'], ['smug', 5, 'Изи!', '😏'], ['angry', 3, 'Грр!', '😡'], ['shocked', 4, 'Что?!', '😱'], ['cry', 2, 'За что?!', '😭']];
  let emoCoolUntil = 0;
  function emosHTML() {
    if (!G || G.phase === 'gameOver') return '';
    const id = typeof avatarSeeds[me] === 'string' ? avatarSeeds[me] : null;
    const cool = Date.now() < emoCoolUntil ? 'cool' : '';
    return `<button class="emo-toggle ${emoOpen ? 'on' : ''}" data-emo-toggle aria-label="Реакции" aria-expanded="${emoOpen}">😊</button><div class="emos ${emoOpen ? 'open' : ''}" aria-label="Реакции">${EMOS.map(([m, cell, , em]) => `<button class="emo ${cool}" data-emo="${m}" title="${m === 'laugh' ? 'Посмеяться' : m === 'smug' ? 'Похвастаться' : m === 'angry' ? 'Разозлиться' : m === 'shocked' ? 'Удивиться' : 'Поплакать'}">${id && useSprites()
      ? `<i style="background-image:url('sprites/${id}.webp');background-size:800% auto;background-position:${(cell * 100 / 7).toFixed(3)}% 12%"></i>` : `<i>${em}</i>`}</button>`).join('')}</div>`;
  }
  const EMO_REPLY = { laugh: ['annoyed', 'angry', 'laugh'], smug: ['annoyed', 'sly', 'evil'], angry: ['laugh', 'smug', 'shocked'], shocked: ['laugh', 'sly'], cry: ['laugh', 'evil', 'relief'] };
  let emoOpen = false;
  function sendEmo(mood) {
    emoOpen = false;
    if (!G || Date.now() < emoCoolUntil) return;
    emoCoolUntil = Date.now() + 1500;
    prof.emotes = (prof.emotes || 0) + 1; saveProf(); if (prof.emotes >= 15) unlock('social');
    const e = EMOS.find(x => x[0] === mood);
    setMood(me, mood, 2600, e ? e[2] : undefined);
    setTimeout(() => render(), 1550);
    if (NET.online) { NET.send({ t: 'emote', mood }); return; }
    // боты отвечают на вашу реакцию
    const bots = G.players.filter(p => p.isBot && !p.out);
    if (bots.length && Math.random() < .7) {
      const b = bots[Math.floor(Math.random() * bots.length)], pool = EMO_REPLY[mood] || ['meh'];
      setTimeout(() => setMood(b.id, pool[Math.floor(Math.random() * pool.length)], 2600), 650 + Math.random() * 500);
    }
  }
  function render() {
    if (!G) return;
    if (G.skinSeed == null) G.skinSeed = (Math.random() * 2 ** 31) | 0;
    applyDeck();
    const lm = E.legalMoves(G);
    const myTurn = G.current === me && ACTIVE.has(G.phase);
    $('roundChip').textContent = `партия ${G.round}`;

    // соперники
    $('seats').className = 'seats n' + (G.players.length - 1);
    $('seats').innerHTML = G.players.filter(p => p.id !== me).map(p => `
      <div class="seat ${G.current === p.id && ACTIVE.has(G.phase) ? 'active' : ''} ${p.out ? 'out' : ''}" data-pid="${p.id}">
        <div class="bubble" data-bubble="${p.id}"></div>
        ${avatar(avatarSeeds[p.id], moodOf(p.id))}
        ${p.id === G.dealer ? '<div class="badge-d" title="Сдаёт">сдаёт</div>' : ''}
        ${p.out ? `<div class="badge-last gone">${outW(p.id)}</div>` : p.hand.length === 1 && G.phase === 'play' ? '<div class="badge-last">последняя!</div>' : (G.finisher === p.id && ACTIVE.has(G.phase) ? '<div class="badge-last out">вышел?</div>' : '')}
        <div class="name">${esc(p.name)}</div>
        <div class="fan" ${dealing ? 'style="visibility:hidden"' : ''}>${Array.from({ length: Math.min(p.hand.length, 12) }, () => '<div class="mini back"></div>').join('')}</div>
        <div class="meta">${p.out ? '' : `<span><b>${p.hand.length}</b> ${E.plural(p.hand.length)}</span>`}<span>счёт <b class="${prevScores[p.id] !== undefined && prevScores[p.id] !== p.score ? 'bump' : ''}">${p.score}</b></span></div>
        ${meterHTML(p.score)}
      </div>`).join('');

    // колода и стол
    const deckEl = $('deck');
    const deckClickable = myTurn && G.phase === 'play' && lm.canDraw;
    deckEl.className = 'deck' + (deckClickable ? ' clickable' : '');
    deckEl.innerHTML = G.deck.length ? '<div class="back"></div><div class="back"></div><div class="back"></div>' : '<div class="back" style="opacity:.25"></div>';
    deckEl.setAttribute('role', 'button'); deckEl.tabIndex = deckClickable ? 0 : -1;
    deckEl.setAttribute('aria-label', lm.drawLabel);
    $('deckLbl').textContent = `колода · ${G.deck.length}`;
    const t = E.top(G);
    const pile = G.discard.slice(-3);
    $('discard').innerHTML = pile.map((c, i) => cardHTML(c, i < pile.length - 1 ? 'under' : '', `tabindex="-1" style="--r:${tilt(c, i === pile.length - 1)}deg"`)).join('');
    const tbl = document.querySelector('.table');
    if (tbl) { tbl.classList.toggle('danger', !!(G.pending && ACTIVE.has(G.phase))); tbl.classList.toggle('gold', !!(t.rank === 'Q' && G.chosenSuit && !G.pending && ACTIVE.has(G.phase))); }
    $('discardLbl').textContent = `бито · ${dlen(G)}`;

    // статус
    let st = '';
    if (G.pending) {
      const what = G.pending.kind === 'K' ? '9♥' : (G.pending.kind === '6' ? 'шестёркой' : 'семёркой');
      st += `<div class="chip danger">Штраф: взять ${G.pending.draws}${G.pending.count < 4 ? ' или отбиться ' + what : ''}</div>`;
    }
    if (G.mustCover) st += `<div class="chip danger">Покрыть восьмёрку: ${E.SUIT_SYM[G.mustCover]}, дама или 8</div>`;
    if (G.finisher != null && ACTIVE.has(G.phase)) st += `<div class="chip gold">${esc(G.players[G.finisher].name)} ${G.finisher === me ? 'вышли' : 'вышел'} — карта действует!</div>`;
    if (G.aceTarget && ACTIVE.has(G.phase)) st += `<div class="chip danger">${G.current === me ? 'Вы' : esc(G.players[G.current].name)} под тузом ${E.SUIT_SYM[t.suit]}</div>`;
    if (t.rank === 'Q' && G.chosenSuit && !G.pending) st += `<div class="chip gold">Заказано <span class="suit-big">${E.SUIT_SYM[G.chosenSuit]}</span></div>`;
    if (ACTIVE.has(G.phase)) {
      st += G.current === me ? `<div class="turn-note you">Ваш ход!</div>` : `<div class="turn-note wait">ходит ${esc(G.players[G.current].name)}</div>`;
    }
    const lastLog = G.log.filter(l => l.k !== 'info').slice(-1)[0];
    if (lastLog && !G.pending && !G.mustCover) st += `<div class="last-act">${esc(lastLog.t)}</div>`;
    $('status').innerHTML = st;
    $('meRow').classList.toggle('active', myTurn);

    // вы
    const p = G.players[me];
    $('meRow').classList.toggle('out', !!p.out);
    $('meRow').innerHTML = `<div class="me-ava"><div class="bubble" data-bubble="${me}"></div>${avatar(avatarSeeds[me], moodOf(me))}${me === G.dealer && !p.out ? '<div class="badge-d">сдаёте</div>' : ''}${p.out ? '<div class="badge-last gone">выбыли</div>' : p.hand.length === 1 && G.phase === 'play' ? '<div class="badge-last">последняя!</div>' : ''}</div><div><div class="name">${esc(p.name)}</div><div class="meta">счёт <b class="${prevScores[me] !== undefined && prevScores[me] !== p.score ? 'bump' : ''}">${p.score}</b> · ${p.out ? 'вы выбыли — смотрите, кто победит' : `до 108 осталось <b>${Math.max(0, 108 - p.score)}</b>`}</div>${meterHTML(p.score)}</div>${emosHTML()}`;
    G.players.forEach(q => { prevScores[q.id] = q.score; });
    const hand = p.hand.slice().sort((a, b) => order(a) - order(b));
    const legal = new Set(myTurn && G.phase === 'play' ? lm.cards : []);
    $('hand').innerHTML = hand.map(c => cardHTML(c,
      (legal.has(c.id) ? 'legal' : (myTurn && G.phase === 'play' ? 'dim' : '')) + (lastHandIds.has(c.id) ? '' : ' new'),
      `data-id="${c.id}" ${legal.has(c.id) ? '' : 'tabindex="-1"'}`)).join('');
    $('hand').style.visibility = dealing ? 'hidden' : '';
    layoutHand();
    lastHandIds = new Set(p.hand.map(c => c.id));
    trackRares();
    if (myTurn && !wasMyTurn && !dealing) buzz(25);
    wasMyTurn = myTurn;
    if (!dealing && ACTIVE.has(G.phase)) {
      if (myTurn && G.phase === 'play') coach(G.pending ? 'penalty_me' : 'turn');
      if (G.finisher != null && G.finisher !== me) coach('finisher');
      if (p.score >= 90 && !p.out) coach('danger');
    }

    // действия
    let a = '';
    if (myTurn && G.phase === 'play') {
      if (lm.canDraw) a += `<button class="btn ${lm.cards.length && !G.pending ? '' : 'primary'}" data-act="draw">${esc(lm.drawLabel)}</button>`;
      if (lm.canPass) a += `<button class="btn ${lm.passLabel ? '' : 'primary'}" data-act="pass">${esc(lm.passLabel || 'Пас')}</button>`;
      if (lm.canFinishQueens) a += `<button class="btn primary" data-act="queens">Сбросить всех дам и закрыть партию</button>`;
      if (G.aceTarget && lm.canPass) a += `<span class="hint">${lm.cards.length ? 'Отбейтесь тузом или картой той же масти — или пропустите ход' : 'Нечем отбиться — пропустите ход'}</span>`;
      else if (G.aceTarget && lm.canDraw) a += `<span class="hint">Вы под тузом без карт — берите карту и возвращайтесь в игру</span>`;
      else if (lm.cards.length && !lm.canPass) a += `<span class="hint">${G.pending || G.mustCover ? 'Подсвеченной картой можно отбиться' : 'Сыграйте подсвеченную карту или возьмите из колоды'}</span>`;
    }
    $('actions').innerHTML = a;


    // модальные окна по фазе
    if (G.phase === 'chooseSuit' && G.current === me) showSuitModal();
    else if (G.phase === 'counterOffer' && G.current === me) showCounterModal();
    else if (G.phase === 'roundEnd') { if (!window.__promoNoModal) setTimeout(showRoundModal, 500); }
    else if (G.phase === 'gameOver') setTimeout(showGameOverModal, 500);
    else if (document.querySelector('.modal-bg[data-auto]')) closeModal();
  }

  // ---------- летающие карты ----------
  function rectOf(sel) { const el = typeof sel === 'string' ? document.querySelector(sel) : sel; return el ? el.getBoundingClientRect() : null; }
  function seatRect(pid) {
    if (pid === me) return rectOf('#hand');
    const f = rectOf(`.seat[data-pid="${pid}"] .fan`);
    return f && f.width ? f : rectOf(`.seat[data-pid="${pid}"] .ava-wrap`);
  }
  // телефон: карты в руке ложатся внахлёст, а при большой руке — в два ряда, чтобы всё помещалось в экран
  function layoutHand() {
    const h = $('hand'); if (!h) return;
    h.querySelectorAll('.hand-break').forEach(x => x.remove());
    const cards = [...h.querySelectorAll('.card')];
    cards.forEach(c => { c.style.marginLeft = ''; c.style.marginTop = ''; c.style.zIndex = ''; });
    if (!window.matchMedia('(max-width: 560px)').matches || !cards.length) return;
    const W = h.clientWidth - 4, cw = cards[0].offsetWidth, ch = cards[0].offsetHeight, n = cards.length;
    const rows = n * cw * 0.6 > W ? 2 : 1;
    const per = Math.ceil(n / rows);
    const step = Math.min(cw + 6, (W - cw) / Math.max(1, per - 1));
    cards.forEach((c, i) => {
      if (i % per) c.style.marginLeft = (step - cw) + 'px';
      if (i >= per) c.style.marginTop = -Math.round(ch * 0.38) + 'px';
      c.style.zIndex = String(i + 1);
    });
    if (rows === 2) { const br = document.createElement('div'); br.className = 'hand-break'; h.insertBefore(br, cards[per]); }
  }
  function fly(from, to, face, opts) {
    if (REDUCED || !from || !to) return Promise.resolve();
    const o = Object.assign({ dur: 420, delay: 0, rot: 0 }, opts || {});
    o.dur *= SPD(); o.delay *= SPD();
    const el = document.createElement('div');
    el.innerHTML = face ? cardHTML(face, '', 'tabindex="-1"') : '<div class="back"></div>';
    const node = el.firstElementChild;
    $('fx').appendChild(node);
    const w = node.offsetWidth, h = node.offsetHeight;
    const fx = from.left + from.width / 2 - w / 2, fy = from.top + from.height / 2 - h / 2;
    const tx = to.left + to.width / 2 - w / 2, ty = to.top + to.height / 2 - h / 2;
    const anim = node.animate([
      { transform: `translate(${fx}px, ${fy}px) rotate(${o.rot}deg) scale(.9)`, opacity: 1 },
      { transform: `translate(${tx}px, ${ty}px) rotate(0deg) scale(1)`, opacity: 1 },
    ], { duration: o.dur, delay: o.delay, easing: 'cubic-bezier(.3, 1.3, .5, 1)', fill: 'both' });
    return anim.finished.catch(() => {}).then(() => node.remove());
  }

  // снимок до действия → после действия вычисляем, что полетело
  function snap() {
    const handRects = {};
    document.querySelectorAll('#hand .card').forEach(el => { handRects[el.dataset.id] = el.getBoundingClientRect(); });
    return {
      current: G.current, discard: dlen(G), round: G.round, finisher: G.finisher, chosenSuit: G.chosenSuit,
      pending: G.pending, mustCover: G.mustCover,
      hands: G.players.map(p => p.hand.length),
      deck: rectOf('#deck'), disc: rectOf('#discard'), handRects, seats: G.players.map(p => seatRect(p.id)),
    };
  }
  function animateDiff(b) {
    if (G.round !== b.round) return animateDeal();
    const flights = [];
    const played = dlen(G) - b.discard;
    const playedBy = {};
    if (played > 0 && dlen(G) >= b.discard) {
      const cards = G.discard.slice(-played);
      playedBy[b.current] = played;
      cards.forEach((c, i) => {
        const from = b.current === me ? (b.handRects[c.id] || b.seats[me]) : b.seats[b.current];
        flights.push(fly(from, b.disc, c, { delay: i * 90, rot: b.current === me ? -12 : 12 }));
      });
      if (b.disc) { $('discard').style.visibility = 'hidden'; }
    }
    G.players.forEach((p, i) => {
      const drew = p.hand.length - b.hands[i] + (playedBy[i] || 0);
      if (drew > 0) {
        for (let k = 0; k < Math.min(drew, 8); k++) flights.push(fly(b.deck, b.seats[i], null, { delay: k * 70, dur: 380, rot: -20 }));
      }
    });
    return Promise.all(flights).then(() => { $('discard').style.visibility = ''; });
  }
  function animateDeal() {
    Object.keys(moods).forEach(k => delete moods[k]);
    dealing = true; render();
    const deck = rectOf('#deck'), flights = [];
    const n = G.players.filter(p => !p.out).length;
    let seat = E.nextIdx(G, G.dealer), k = 0;
    const act = G.players.filter(p => !p.out).length;
    roundBanner(`Партия ${G.round}`, `сдаёт ${G.players[G.dealer].name}${G.mode === 'elim' ? ` · за столом ${act}` : ''}`);
    for (let c = 0; c < 4 * n; c++) {
      setTimeout(() => SFX.play('deal', { minGap: 0, vol: .7 }), k * 55 * SPD());
      flights.push(fly(deck, seatRect(seat), null, { delay: k++ * 55, dur: 360, rot: -25 }));
      seat = E.nextIdx(G, seat);
    }
    const opener = E.top(G);
    $('discard').style.visibility = 'hidden';
    flights.push(fly(deck, rectOf('#discard'), opener, { delay: k * 55 + 100, dur: 420, rot: 180 }));
    return Promise.all(flights).then(() => { dealing = false; $('discard').style.visibility = ''; render(); });
  }
  // выполнить действие с анимацией
  function act(fn) {
    const b = snap();
    lastActionAt = Date.now();
    fn();
    closeModal();
    render();
    if (G.round === b.round) reactToDiff(b);
    saveGame();
    return animateDiff(b);
  }
  // ---------- сохранение партии между перезагрузками ----------
  function saveGame() {
    if (NET.online) return;
    try { if (G && G.phase !== 'gameOver') localStorage.setItem('g108save', JSON.stringify({ G, me, myName, avatarSeeds, t: Date.now() })); else localStorage.removeItem('g108save'); } catch (e) {}
  }
  function loadGame() {
    try { const d = JSON.parse(localStorage.getItem('g108save') || 'null'); return d && d.G && d.G.players ? d : null; } catch (e) { return null; }
  }

  // ---------- модальные окна ----------
  function modal(html, auto) {
    closeModal();
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; if (auto) bg.dataset.auto = '1';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    $('modals').appendChild(bg);
    const f = bg.querySelector('input') || bg.querySelector('.btn.primary') || bg.querySelector('button'); if (f) f.focus({ preventScroll: true });
    return bg;
  }
  function closeModal() { $('modals').innerHTML = ''; }

  function showSuitModal() {
    if (document.querySelector('.modal-bg[data-kind="suit"]')) return;
    const bg = modal(`<h2>Какую масть заказываете?</h2><div class="suits">${E.SUITS.map(s =>
      `<button class="suit-btn ${s === 'H' || s === 'D' ? 'red' : ''}" data-suit="${s}">${E.SUIT_SYM[s]}<small>${E.SUIT_RU[s]}</small></button>`).join('')}</div>`, true);
    bg.dataset.kind = 'suit';
    bg.querySelectorAll('[data-suit]').forEach(b => b.onclick = () => doAct('suit', b.dataset.suit));
  }
  function showCounterModal() {
    if (document.querySelector('.modal-bg[data-kind="offer"]')) return;
    const c = G.players[me].hand.find(x => x.id === G.offerCard);
    const bg = modal(`<h2>Первой картой пришла ${E.cardName(c)}!</h2>
      <div class="offer">${cardHTML(c, '', 'tabindex="-1"')}<p>Можно отбиться ею — штраф уйдёт дальше, а брать ничего не нужно. Или взять все ${G.pending.draws} ${E.plural(G.pending.draws)}.</p></div>
      <div class="row"><button class="btn" data-act="decline">Взять ${G.pending.draws}</button><button class="btn primary" data-act="accept">Отбиться</button></div>`, true);
    bg.dataset.kind = 'offer';
    bg.querySelector('[data-act=accept]').onclick = () => doAct('accept');
    bg.querySelector('[data-act=decline]').onclick = () => doAct('decline');
  }
  function scoreRows(results) {
    return results.map(r => {
      const p = G.players[r.idx];
      const handTxt = r.hand.length ? r.hand.map(id => E.RANK_RU[id.slice(0, -1)] + E.SUIT_SYM[id.slice(-1)]).join(' ') : '—';
      return `<tr class="${r.idx === me ? 'me' : ''}"><td>${esc(p.name)}${r.idx === G.lastRound.finisher ? '<span class="badge">закрыл</span>' : ''}<div class="note">${esc(r.note)}</div></td>
        <td class="note">${handTxt}</td>
        <td class="num ${r.pts < 0 ? 'neg' : (r.pts > 0 ? 'pos' : '')}">${r.pts > 0 ? '+' : ''}${r.pts}</td>
        <td class="num">${r.before} → <b>${r.after}</b>${r.reset ? '<span class="badge">107 → 0</span>' : ''}</td></tr>`;
    }).join('');
  }
  function showRoundModal() {
    if (!G || G.phase !== 'roundEnd' || document.querySelector('.modal-bg[data-kind="round"]')) return;

      myName = bg.querySelector('#nameInput').value.trim() || 'Вы';
      try { localStorage.setItem('g108name', myName); localStorage.setItem('g108n', n); } catch (e) {}
      newGame(n);
    };
  }

  // ---------- онлайн: комнаты по ссылке (server.js, WebSocket /ws) ----------
  const NET = (() => {
    const available = IS_APP || (/^https?:$/.test(location.protocol) && !/claude\.ai$/.test(location.hostname));   // артефакт на claude.ai — без сервера
    const api = { available, online: false, room: null, token: null, pid: -1, lobby: null, ws: null, send: () => {}, leave: () => {} };
    let ws = null, reconnectT = null, wantRoom = null, onJoinErr = null;
    const url = () => IS_APP ? `wss://${SERVER}/ws` : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    function saveSess() { try { if (api.room && api.token) localStorage.setItem('g108online', JSON.stringify({ room: api.room, token: api.token })); else localStorage.removeItem('g108online'); } catch (e) {} }
    function loadSess() { try { return JSON.parse(localStorage.getItem('g108online') || 'null'); } catch (e) { return null; } }
    function connect(room, token, errCb) {
      wantRoom = room || ''; api.token = token || null; onJoinErr = errCb || null;
      if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
      ws = new WebSocket(url()); api.ws = ws;
      ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: wantRoom, name: myName, char: myChar, token: api.token }));
      ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handle(m); };
      ws.onclose = () => { if (api.online) { setStatus('Связь потеряна, переподключаюсь…'); reconnectT = setTimeout(() => connect(api.room, api.token), 1500); } else if (onJoinErr) { const cb = onJoinErr; onJoinErr = null; cb('Онлайн-сервер недоступен по этому адресу'); } };
      ws.onerror = () => {};
    }
    function handle(m) {
      if (m.t === 'joined') { api.online = true; api.room = m.room; api.token = m.token; api.pid = m.pid; wantRoom = m.room; saveSess(); setStatus(''); history.replaceState(null, '', '?room=' + m.room); }
      else if (m.t === 'lobby') { api.lobby = m; if (!m.started) showLobbyModal(m); else { const lb = document.querySelector('.modal-bg[data-kind="lobby"]'); if (lb) closeModal(); } }
      else if (m.t === 'state') { onState(m); }
      else if (m.t === 'emote') { if (G && m.pid !== me && G.players[m.pid]) { const e = EMOS.find(x => x[0] === m.mood); setMood(m.pid, m.mood, 2600, e ? e[2] : undefined); } }
      else if (m.t === 'error') { if (!api.online && onJoinErr) onJoinErr(m.msg); else setStatus(m.msg); if (!api.online) { api.token = null; saveSess(); } }
    }
    function setStatus(t) { const el = $('netStatus'); if (el) { el.textContent = t; el.hidden = !t; } }
    api.send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
    api.connect = connect;
    api.leave = () => { clearTimeout(reconnectT); api.online = false; api.send({ t: 'leave' }); if (ws) { ws.onclose = null; ws.close(); } ws = null; api.room = null; api.token = null; api.lobby = null; G = null; saveSess(); history.replaceState(null, '', location.pathname); setStatus(''); };
    api.resume = () => { const sess = loadSess(); const q = (new URLSearchParams(location.search).get('room') || '').toUpperCase(); if (q && sess && sess.room === q) return sess; if (q) return { room: q, ask: true }; if (sess) return sess; return null; };
    return api;
  })();
  // пришло состояние стола от сервера
  function onState(m) {
    const prev = G, b = prev ? snap() : null;
    G = m.G; me = m.me; avatarSeeds = m.seeds; lastActionAt = Date.now();
    if (SP) SP.preload(avatarSeeds, () => render()); SFX.preload();
    if (!prev) { applyScene(true); deckNow = null; applyDeck(); trackGameStart(); }
    if (!prev || !b || G.round !== b.round) { Object.keys(moods).forEach(k => delete moods[k]); closeModal(); lastHandIds = new Set(); SFX.play('shuffle'); animateDeal(); return; }
    closeModal(); render(); reactToDiff(b); animateDiff(b);
  }
  function showOnlineModal(err) {
    const q = new URLSearchParams(location.search).get('room') || '';
    const bg = modal(`<h2>Игра с друзьями</h2>
      <p>Создайте комнату и отправьте друзьям ссылку — или введите код комнаты, который прислали вам. Свободные места можно занять ботами.</p>
      ${err ? `<p class="net-err">${esc(err)}</p>` : ''}
      <div class="field"><label for="nameInput2">Ваше имя</label><input id="nameInput2" value="${esc(myName)}" maxlength="16"></div>
      ${useSprites() ? `<div class="field"><label>Ваш герой</label><div class="start-ava pick">${SP.CHARS.map(c => `<button class="pick-btn ${c === myChar ? 'on' : ''}" data-char="${c}" title="${SP.LABEL[c]}">${avatar(c, 'neutral')}</button>`).join('')}</div></div>` : ''}
      <div class="field"><label for="roomInput">Код комнаты</label><input id="roomInput" value="${esc(q)}" maxlength="4" placeholder="например, K7PQ" style="text-transform:uppercase"></div>
      <div class="row"><button class="btn" data-act="back">Назад</button><button class="btn" data-act="join">Войти по коду</button><button class="btn primary" data-act="create">Создать комнату</button></div>`);
    bg.querySelector('[data-act=back]').onclick = showStart;
    bg.querySelectorAll('.pick-btn').forEach(b => b.onclick = () => { bg.querySelectorAll('.pick-btn').forEach(x => x.classList.remove('on')); myChar = b.dataset.char; b.classList.add('on'); try { localStorage.setItem('g108char', myChar); } catch (e) {} });
    const go = room => { myName = bg.querySelector('#nameInput2').value.trim() || 'Игрок'; try { localStorage.setItem('g108name', myName); } catch (e) {} bg.querySelectorAll('.btn').forEach(x => x.disabled = true); NET.connect(room, null, msg => showOnlineModal(msg)); };
    bg.querySelector('[data-act=create]').onclick = () => go('');
    bg.querySelector('[data-act=join]').onclick = () => { const r = bg.querySelector('#roomInput').value.trim().toUpperCase(); if (r.length === 4) go(r); else bg.querySelector('#roomInput').focus(); };
    bg.querySelector('#roomInput').addEventListener('keydown', e => { if (e.key === 'Enter') bg.querySelector('[data-act=join]').click(); });
  }
  function showLobbyModal(l) {
    const host = l.players.some(p => p.host && p.pid === NET.pid);
    const link = (IS_APP ? `https://${SERVER}/` : location.origin + location.pathname) + '?room=' + l.room;
    const existing = document.querySelector('.modal-bg[data-kind="lobby"]');
    const html = `<h2>Комната <span class="room-code">${esc(l.room)}</span></h2>
      <div class="field"><label>Ссылка для друзей</label><div class="linkrow"><input id="linkInput" readonly value="${esc(link)}"><button class="btn small" data-act="copy">Копировать</button></div></div>
      <div class="lobby">${l.players.map(p => `<div class="lp ${p.online ? '' : 'off'}">${avatar(p.char, p.host ? 'smug' : 'neutral')}<div class="lp-name">${esc(p.name)}${p.host ? ' <span class="badge">хозяин</span>' : ''}${p.isBot ? ' <span class="badge bot">бот</span>' : ''}${!p.online ? ' <span class="badge off">нет связи</span>' : ''}</div>${host && p.isBot ? `<button class="btn small" data-rm="${p.pid}">убрать</button>` : ''}</div>`).join('')}
        ${l.players.length < 6 && host ? '<button class="lp add" data-act="bot">+ бот</button>' : ''}</div>
      ${host ? `<div class="opts"><div class="field"><label>Сила ботов</label><div class="seg" id="lvl">${LEVELS.map(([k, t]) => `<button class="${k === l.level ? 'on' : ''}" data-lvl="${k}">${t}</button>`).join('')}</div></div>
        <div class="field"><label>Режим</label><div class="seg" id="lmode">${MODES.map(([k, t]) => `<button class="${k === (l.mode || 'classic') ? 'on' : ''}" data-mode="${k}">${t}</button>`).join('')}</div></div></div>`
        : `<p class="note">Режим: <b>${(MODES.find(m => m[0] === (l.mode || 'classic')) || MODES[0])[1]}</b>. Ждём, пока хозяин комнаты начнёт игру…</p>`}
      <div class="row"><button class="btn" data-act="leave">Выйти</button>${host ? `<button class="btn primary" data-act="start" ${l.players.length < 2 ? 'disabled' : ''}>Начать (${l.players.length})</button>` : ''}</div>`;
    const bg = existing ? (existing.querySelector('.modal').innerHTML = html, existing) : modal(html);
    bg.dataset.kind = 'lobby';
    bg.querySelector('[data-act=copy]').onclick = () => { const inp = bg.querySelector('#linkInput'); inp.select(); try { navigator.clipboard.writeText(link); } catch (e) { document.execCommand('copy'); } bg.querySelector('[data-act=copy]').textContent = 'Скопировано'; };
    bg.querySelector('[data-act=leave]').onclick = () => { NET.leave(); showStart(); };
    const st = bg.querySelector('[data-act=start]'); if (st) st.onclick = () => NET.send({ t: 'start' });
    const ab = bg.querySelector('[data-act=bot]'); if (ab) ab.onclick = () => NET.send({ t: 'addBot' });
    bg.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => NET.send({ t: 'removeBot', pid: +b.dataset.rm }));
    bg.querySelectorAll('#lvl button').forEach(b => b.onclick = () => NET.send({ t: 'level', level: b.dataset.lvl }));
    bg.querySelectorAll('#lmode button').forEach(b => b.onclick = () => NET.send({ t: 'mode', mode: b.dataset.mode }));
  }

  // ---------- игра ----------
  function newGame(n, opts) {
    opts = opts || {};
    Object.keys(moods).forEach(k => delete moods[k]);
    const daily = opts.daily ? todayKey() : null;
    const dseed = daily ? seedOf('108-daily-' + daily) : null;
    const rnd = daily ? seededRand(dseed) : Math.random;
    const names = BOT_NAMES.slice().sort(() => rnd() - .5);
    const players = [{ name: myName, isBot: false }];
    const sprites = useSprites();
    let seeds = [];
    if (sprites) {
      // герой игрока — выбранный или случайный; боты — остальные герои под своими именами, парни и девушки вперемешку
      const mine = myChar && SP.CHARS.includes(myChar) ? myChar : SP.CHARS[Math.floor(Math.random() * SP.CHARS.length)];
      const rest = SP.CHARS.filter(c => c !== mine).map(c => [c, rnd()]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      seeds = [mine, ...rest.slice(0, n - 1)];
      for (let i = 1; i < n; i++) players.push({ name: CHAR_NAMES[seeds[i]] || names[i - 1][0], isBot: true, strategy: daily ? 'pro' : settings.level });
    } else {
      for (let i = 1; i < n; i++) players.push({ name: names[i - 1][0], isBot: true, strategy: settings.level });
    }
    G = daily ? E.createGame({ players, mode: 'classic', seed: dseed, skinSeed: dseed }) : E.createGame({ players, mode: settings.mode });
    if (daily) G.daily = daily;
    me = 0;
    applyScene(true, daily ? SCENES[Math.abs(dseed) % SCENES.length][0] : null);
    deckNow = null; applyDeck(); trackGameStart();
    if (daily) setTimeout(() => toast('🗓', `Партия дня · ${dayLabel(daily)}`, 'Первая раздача сегодня у всех одна — сравните результат с друзьями', 'ach'), 600);
    setTimeout(() => coach('welcome'), 900);
    if (sprites) {
      avatarSeeds = seeds;
      SP.preload(avatarSeeds, () => render());
      SFX.preload();
    } else {
      // векторный режим: причёска по имени, цвета — разные у всех за столом
      const used = new Set();
      const pick = (styles) => { for (let t = 0; t < 40; t++) { const st = styles[Math.floor(Math.random() * styles.length)]; const seed = st + 6 * Math.floor(Math.random() * 4); if (!used.has(seed)) { used.add(seed); return seed; } } return Math.floor(Math.random() * 24); };
      avatarSeeds = G.players.map((p, i) => i === 0 ? pick([0, 1, 2, 3, 4, 5]) : pick(names[i - 1][1] ? STYLES_F : STYLES_M));
    }
    E.startRound(G);
    lastHandIds = new Set();
    closeModal();
    saveGame(); SFX.play('shuffle');
    animateDeal().then(scheduleBots);
  }
  function myMove(fn) { clearTimeout(botTimer); act(fn).then(scheduleBots); }
  // одно действие игрока: онлайн — на сервер, иначе — в локальный движок
  function doAct(kind, arg) {
    if (NET.online) { NET.send({ t: 'act', a: kind, card: kind === 'play' ? arg : undefined, suit: kind === 'suit' ? arg : undefined }); return; }
    const fns = { play: () => E.playCard(G, arg), draw: () => E.draw(G), pass: () => E.pass(G), queens: () => E.finishWithQueens(G),
      suit: () => E.chooseSuit(G, arg), accept: () => E.acceptCounter(G), decline: () => E.declineCounter(G) };
    if (fns[kind]) myMove(fns[kind]);
  }
  function scheduleBots() {
    clearTimeout(botTimer);
    if (!G || NET.online) return;
    const p = G.players[G.current];
    if (!ACTIVE.has(G.phase) || !p.isBot) return;
    botTimer = setTimeout(() => { act(() => E.botAction(G)).then(scheduleBots); }, (G.phase === 'play' ? 800 : 500) * SPD());
  }

  // ---------- события ----------
  $('hand').addEventListener('click', e => {
    const b = e.target.closest('.card.legal');
    if (!b) {
      const d = e.target.closest('.card');
      if (d && G && G.current === me && G.phase === 'play') { d.classList.remove('nope'); void d.offsetWidth; d.classList.add('nope'); SFX.play('boing'); explainIllegal(d.dataset.id); }
      return;
    }
    doAct('play', b.dataset.id);
  });
  $('seats').addEventListener('click', e => { const s_ = e.target.closest('.seat'); if (s_ && e.target.closest('.ava-wrap')) poke(+s_.dataset.pid); });
  $('btnProfile').onclick = () => showProfileModal();
  $('btnMenu').onclick = () => showMenuModal();
  if (IS_APP && CAP.App && CAP.App.addListener) {
    CAP.App.addListener('backButton', () => {
      const mb = document.querySelector('.modal-bg');
      if (mb) {
        if (mb.querySelector('#nameInput')) { CAP.App.exitApp(); return; }                 // стартовый экран — выходим
        const c = mb.querySelector('[data-act=close], [data-act=back]');
        if (c) c.click(); else if (!mb.dataset.auto) closeModal();
        return;
      }
      if (G) showMenuModal(); else CAP.App.exitApp();
    });
  }
  $('btnAlbum').onclick = () => showAlbumModal();
  $('actions').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act_ = b.dataset.act;
    doAct(act_);
  });
  const deckClick = () => { if ($('deck').classList.contains('clickable')) doAct('draw'); };
  $('deck').addEventListener('click', deckClick);
  $('deck').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); deckClick(); } });
  $('btnScore').onclick = () => G && showScoreModal();
  $('btnRules').onclick = () => showRulesModal();
  $('btnLore').onclick = () => showLoreModal();
  $('meRow').addEventListener('click', e => {
    if (e.target.closest('[data-emo-toggle]')) { emoOpen = !emoOpen; render(); return; }
    const b = e.target.closest('[data-emo]'); if (b) sendEmo(b.dataset.emo);
  });
  $('btnNew').onclick = () => { if (NET.online) { if (confirm('Выйти из онлайн-комнаты?')) { NET.leave(); showStart(); } } else showStart(); };
  $('btnLog').onclick = () => G && showLogModal();
  const syncSoundBtn = () => { $('btnSound').textContent = settings.sound ? '🔊' : '🔇'; $('btnSound').title = settings.sound ? 'Звук включён' : 'Звук выключен'; };
  $('btnSound').onclick = () => { settings.sound = !settings.sound; saveSettings(); syncSoundBtn(); SFX.warm(); SFX.play('click'); };
  syncSoundBtn();
  document.addEventListener('pointerdown', () => SFX.warm(), { once: true });
  document.addEventListener('click', e => { if (e.target.closest('.btn, .seg button, .suit-btn, .pick-btn')) SFX.play(e.target.closest('.btn.primary') ? 'ok' : 'click'); }, true);
  window.addEventListener('resize', () => { if (G) render(); });

  // ---------- запуск (с восстановлением при обновлении страницы) ----------
  function start(data) {
    const sess = NET.available ? NET.resume() : null;
    if (sess && sess.ask) { showOnlineModal(); return; }
    if (sess) { NET.connect(sess.room, sess.token || null, msg => showOnlineModal(msg)); return; }
    if (!(data && data.G)) data = loadGame() || data;
    if (data && data.G) {
      G = data.G; me = data.me || 0; myName = data.myName || myName;
      avatarSeeds = data.avatarSeeds || G.players.map((p, i) => i * 7 % 24);
      if (SP) SP.preload(avatarSeeds, () => render());
      SFX.preload();
      applyScene(true);
      if (G.phase === 'roundEnd' || G.phase === 'gameOver') reactToRoundEnd();
      
      render(); scheduleBots();
    } else showStart();
  }
  // режим съёмки рекламного ролика (?promo=1): сценарий ходит за всех игроков
  if (/[?&]promo=1(&|$)/.test(location.search)) {
    window.__promoNoModal = true;
    window.__promo = { E, act, render, animateDeal, closeModal, get G() { return G; },
      play: id => act(() => E.playCard(G, id)),
      draw: () => act(() => { E.draw(G); if (G.phase === 'counterOffer') E.declineCounter(G); }) };
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ G, me, myName, avatarSeeds }));
  }
  window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
